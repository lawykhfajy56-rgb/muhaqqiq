<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحقق</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#0e1c2b;--bg2:#17304a;--paper:#efe6d2;--ink:#1d2733;--brass:#d2a64a;--red:#b3392f;--green:#2f7d5b;--mute:#8fa3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0,var(--bg2),var(--bg) 70%) var(--bg);color:#f4ecd8;font-family:Tajawal,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:16px 18px 24px;display:flex;flex-direction:column;min-height:100vh}
h1,h2,.k{font-family:'Reem Kufi',Tajawal,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.lens{width:150px;height:150px}
.home h1{font-size:64px;margin:0;color:var(--brass);letter-spacing:1px;line-height:1}
.home p{margin:0;color:var(--mute);font-size:17px;max-width:300px;line-height:1.7}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.cats span{border:1px solid #3a5470;border-radius:99px;padding:6px 14px;font-size:14px;color:#cdd8e4}
.cta{background:var(--brass);color:#2a2008;font-family:'Reem Kufi';font-weight:700;font-size:22px;padding:14px 44px;border-radius:14px;box-shadow:0 6px 0 #8c6c25;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #8c6c25}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{font-family:'Reem Kufi';color:var(--brass);font-size:18px}
.score{font-size:14px;color:var(--mute)}
.ladder{display:flex;gap:5px;margin:12px 0}
.ladder i{flex:1;height:7px;border-radius:4px;background:#27415b;transition:background .4s}
.ladder i.d{background:var(--brass)}.ladder i.c{background:#f4ecd8;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.4}}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi';font-size:19px}
.file{position:relative;background:var(--paper);color:var(--ink);border-radius:6px 6px 14px 14px;padding:22px 20px 20px;margin-top:10px;box-shadow:0 14px 30px #0008;transform:rotate(-.6deg);animation:in .45s cubic-bezier(.2,.9,.3,1.2)}
.file:before{content:"";position:absolute;top:-12px;right:22px;width:96px;height:14px;background:#cdbf9e;border-radius:6px 6px 0 0}
@keyframes in{from{transform:translateY(30px) rotate(2deg);opacity:0}}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:1px 9px;margin-bottom:10px}
.q{font-family:'Reem Kufi';font-size:23px;line-height:1.65;margin:0}
.opts{display:grid;gap:10px;margin:16px 0 12px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:#13283d;border:1.5px solid #34506c;border-radius:14px;padding:14px;font-size:18px;font-weight:500;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt em{font-style:normal;font-family:'Reem Kufi';width:30px;height:30px;border-radius:50%;background:#27415b;display:grid;place-items:center;flex:none;color:var(--brass)}
.opt.gone{opacity:.15;pointer-events:none;text-decoration:line-through}
.opt.ok{background:var(--green);border-color:#7be0b0;animation:pop .4s}
.opt.no{background:var(--red);border-color:#ff9a8f;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bar{height:6px;border-radius:3px;background:var(--brass);margin-inline-start:auto;width:0;transition:width .7s}
.help{display:flex;gap:8px}
.help button{flex:1;background:#13283d;border:1.5px solid #34506c;border-radius:12px;padding:9px 4px;font-size:13px;line-height:1.4}
.help button b{display:block;font-size:20px}
.help button:disabled{opacity:.3}
.fact{background:#0b1724;border:1px dashed var(--brass);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.75;animation:in .4s}
.fact strong{color:var(--brass);font-family:'Reem Kufi'}
.next{margin-top:12px;width:100%}
.stamp{position:absolute;left:14px;top:12px;font-family:'Reem Kufi';font-size:26px;font-weight:700;border:3px solid;border-radius:8px;padding:0 12px;transform:rotate(-12deg);animation:st .35s cubic-bezier(.2,2,.4,1)}
.stamp.ok{color:var(--green)}.stamp.no{color:var(--red)}
@keyframes st{from{transform:rotate(-12deg) scale(3);opacity:0}}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.end h2{font-size:40px;color:var(--brass);margin:0}
.end .big{font-family:'Reem Kufi';font-size:26px}
.hint{margin-top:8px;font-size:14px;color:var(--ink);background:#e2d6b9;border-radius:8px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.home{justify-content:flex-start;padding-top:8px;gap:10px}
.lens{width:84px;height:84px}.home h1{font-size:46px}.home p{font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;background:#13283d;border:1.5px solid #34506c;border-radius:16px;padding:14px 8px;transition:transform .12s,border-color .2s}
.card:active{transform:scale(.96);border-color:var(--brass)}
.card .ic{font-size:30px}.card b{font-size:20px;color:var(--brass)}
.card small{color:#cdd8e4;font-size:13px}.card u{text-decoration:none;color:var(--mute);font-size:12px;margin-top:4px}
.back{background:#13283d;border:1.5px solid #34506c;border-radius:50%;width:38px;height:38px;font-size:16px;flex:none}
.top{gap:12px}
.ghost{background:none;border:1.5px solid #34506c;border-radius:14px;padding:12px 36px;font-size:17px}
.hud{display:flex;align-items:center;gap:12px;width:100%;background:#13283d;border:1.5px solid #34506c;border-radius:14px;padding:10px 14px}
.hud b{color:var(--brass);font-size:18px}.hud small{color:var(--mute)}
.xp{height:6px;border-radius:3px;background:#27415b;margin-top:6px;overflow:hidden}.xp i{display:block;height:100%;background:var(--brass)}
.coin{font-family:'Reem Kufi';font-size:20px;color:var(--brass)}
.ad2{margin-top:8px}.ad2 button{border-color:var(--brass)}
.opt.hintc{border-color:#7be0b0;box-shadow:0 0 0 3px #2f7d5b88}
.gain{text-align:center;color:var(--brass);font-family:'Reem Kufi';margin-top:10px}
.resc{display:grid;gap:10px;margin-top:12px;text-align:center}
.cta.alt{background:#1f4d6e;color:#f4ecd8;box-shadow:0 6px 0 #11304a}.cta:disabled{opacity:.35}
.ad{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:9;text-align:center}
.ad p{font-family:'Reem Kufi';font-size:26px;margin:0}.ad b{display:block;font-size:56px;color:var(--brass);font-family:'Reem Kufi'}
.ad small{color:var(--mute)}
.ad .box{background:var(--bg2);border:1.5px solid var(--brass);border-radius:18px;padding:22px;width:min(88vw,360px);display:grid;gap:12px}
.credit{margin-top:auto;padding-top:14px;text-align:center;color:var(--mute);font-size:13px;line-height:1.9}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--brass);color:#2a2008;padding:10px 18px;border-radius:12px;z-index:10;font-weight:700}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8;font-family:'Reem Kufi',sans-serif;font-size:42px;animation:bn 1.8s forwards}
.banner span{padding:14px 30px;border-radius:18px;background:#000b;border:2px solid}
.banner.l span{color:#ff9a8f;border-color:#b3392f}.banner.w span{color:#7be0b0;border-color:#2f7d5b}
@keyframes bn{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0}}
</style>
</head>

function witness(){if(locked||!help.wit)return;use("wit","#h2");const c=cur()[2],live=[0,1,2,3].filter(k=>!hidden.includes(k));let p={},r=100,m=45+Math.random()*30|0;p[c]=m;r-=m;live.filter(k=>k!=c).forEach((k,n,a)=>{const v=n==a.length-1?r:Math.random()*r|0;p[k]=v;r-=v});live.forEach(k=>{document.querySelector(`.opt[data-k="${k}"] .bar`).style.width=Math.max(p[k],4)*.45+"%"})}
function expert(){if(locked||!help.exp)return;use("exp","#h3");const[,o,c]=cur(),alt=[0,1,2,3].filter(k=>!hidden.includes(k)&&k!=c)[0],say=Math.random()<.85?c:alt;$("#hint").innerHTML=`<div class="hint">🎩 الخبير: «أميل إلى «${o[say]}»، لكن القرار لك أيها المحقق.»</div>`}
function adReveal(){if(locked)return;clearInterval(timer);Ads.show(()=>{document.querySelector(`.opt[data-k="${cur()[2]}"]`).classList.add("hintc");run()})}
function skip(){if(locked)return;clearInterval(timer);
sheet(`<b class="k">تخطّي هذه القضية؟</b><button class="cta" id="sA">🎬 شاهد إعلان</button><button class="cta alt" id="sC" ${P.coins<30?"disabled":""}>🪙 30 عملة</button><button class="ghost" id="sX">إلغاء</button>`,(close)=>{
$("#sA").onclick=()=>{close();Ads.pass(nxt)};
$("#sC").onclick=()=>{close();P.coins-=30;sv();nxt()};
$("#sX").onclick=()=>{close();run()}})}
function pick(k,btn){
if(locked)return;locked=true;clearInterval(timer);
const[,,c,f]=cur(),ok=k===c;
document.querySelectorAll(".opt").forEach(b=>{b.style.pointerEvents="none";if(+b.dataset.k===c)b.classList.add("ok")});
if(btn&&!ok)btn.classList.add("no");
$(".file").insertAdjacentHTML("beforeend",`<div class="stamp ${ok?'ok':'no'}">${ok?'قضية محلولة':k<0?'انتهى الوقت':'قضية فاشلة'}</div>`);
vib(ok?[20]:[80,40,80]);ok?Snd.win():Snd.lose();ok?banner("👏 أحسنت!","w"):banner("حظ أوفر 💔","l");
const fact=`<div class="fact"><strong>ملف المعلومة:</strong> ${f}</div>`;
if(ok){const g=10;P.coins+=g;P.xp+=10+Math.min(i,20)*2;gain+=g;score+=100*(i+1)+left*5;solved++;sv();
$("#after").innerHTML=fact+`<div class="gain">👏 أحسنت! +${g} 🪙 · +${10+Math.min(i,20)*2} خبرة</div><button class="cta next" id="nx">القضية التالية</button>`;$("#nx").onclick=nxt}
else{$("#after").innerHTML=fact+`<div class="resc"><b class="k">حظ أوفر! اعبر المرحلة:</b><button class="cta" id="rA">🎬 شاهد إعلان وتابع</button><button class="cta alt" id="rC" ${P.coins<30?"disabled":""}>🪙 عبور المرحلة بـ 30 كوين</button><button class="ghost" id="rE">أنهِ التحقيق</button></div>`;
$("#rA").onclick=()=>Ads.pass(nxt);
$("#rC").onclick=()=>{P.coins-=30;sv();nxt()};
$("#rE").onclick=end}}
function end(){
save(cat,solved);
app.innerHTML=`<div class="end"><h2 class="k">انتهى التحقيق</h2><div class="big">رتبتك: ${RANKS[Math.min(Math.max(solved-1,0),5)]}</div><p style="color:#8fa3b8;font-size:18px;margin:0">حللت ${solved} قضايا · ${score} نقطة · ربحت ${gain} 🪙</p><p style="color:#8fa3b8;margin:0">رصيدك: ${P.coins} 🪙</p><button class="cta" id="re">تحقيق جديد (أسئلة جديدة)</button><button class="ghost" id="hm">كل الأقسام</button></div>`;
$("#re").onclick=()=>start(cat);$("#hm").onclick=home}
home();
</script>
