<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحقق</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#0e1c2b;--bg2:#17304a;--paper:#efe6d2;--ink:#1d2733;--brass:#d2a64a;--red:#b3392f;--green:#2f7d5b;--mute:#8fa3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0,var(--bg2),var(--bg) 70%) var(--bg);color:#f4ecd8;font-family:Tajawal,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:16px 18px 24px;display:flex;flex-direction:column;min-height:100vh}
h1,h2,.k{font-family:'Reem Kufi',Tajawal,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.lens{width:150px;height:150px}
.home h1{font-size:64px;margin:0;color:var(--brass);letter-spacing:1px;line-height:1}
.home p{margin:0;color:var(--mute);font-size:17px;max-width:300px;line-height:1.7}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.cats span{border:1px solid #3a5470;border-radius:99px;padding:6px 14px;font-size:14px;color:#cdd8e4}
.cta{background:var(--brass);color:#2a2008;font-family:'Reem Kufi';font-weight:700;font-size:22px;padding:14px 44px;border-radius:14px;box-shadow:0 6px 0 #8c6c25;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #8c6c25}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{font-family:'Reem Kufi';color:var(--brass);font-size:18px}
.score{font-size:14px;color:var(--mute)}
.ladder{display:flex;gap:5px;margin:12px 0}
.ladder i{flex:1;height:7px;border-radius:4px;background:#27415b;transition:background .4s}
.ladder i.d{background:var(--brass)}.ladder i.c{background:#f4ecd8;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.4}}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi';font-size:19px}
.file{position:relative;background:var(--paper);color:var(--ink);border-radius:6px 6px 14px 14px;padding:22px 20px 20px;margin-top:10px;box-shadow:0 14px 30px #0008;transform:rotate(-.6deg);animation:in .45s cubic-bezier(.2,.9,.3,1.2)}
.file:before{content:"";position:absolute;top:-12px;right:22px;width:96px;height:14px;background:#cdbf9e;border-radius:6px 6px 0 0}
@keyframes in{from{transform:translateY(30px) rotate(2deg);opacity:0}}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:1px 9px;margin-bottom:10px}
.q{font-family:'Reem Kufi';font-size:23px;line-height:1.65;margin:0}
.opts{display:grid;gap:10px;margin:16px 0 12px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:#13283d;border:1.5px solid #34506c;border-radius:14px;padding:14px;font-size:18px;font-weight:500;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt em{font-style:normal;font-family:'Reem Kufi';width:30px;height:30px;border-radius:50%;background:#27415b;display:grid;place-items:center;flex:none;color:var(--brass)}
.opt.gone{opacity:.15;pointer-events:none;text-decoration:line-through}
.opt.ok{background:var(--green);border-color:#7be0b0;animation:pop .4s}
.opt.no{background:var(--red);border-color:#ff9a8f;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bar{height:6px;border-radius:3px;background:var(--brass);margin-inline-start:auto;width:0;transition:width .7s}
.help{display:flex;gap:8px}
.help button{flex:1;background:#13283d;border:1.5px solid #34506c;border-radius:12px;padding:9px 4px;font-size:13px;line-height:1.4}
.help button b{display:block;font-size:20px}
.help button:disabled{opacity:.3}
.fact{background:#0b1724;border:1px dashed var(--brass);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.75;animation:in .4s}
.fact strong{color:var(--brass);font-family:'Reem Kufi'}
.next{margin-top:12px;width:100%}
.stamp{position:absolute;left:14px;top:12px;font-family:'Reem Kufi';font-size:26px;font-weight:700;border:3px solid;border-radius:8px;padding:0 12px;transform:rotate(-12deg);animation:st .35s cubic-bezier(.2,2,.4,1)}
.stamp.ok{color:var(--green)}.stamp.no{color:var(--red)}
@keyframes st{from{transform:rotate(-12deg) scale(3);opacity:0}}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.end h2{font-size:40px;color:var(--brass);margin:0}
.end .big{font-family:'Reem Kufi';font-size:26px}
.hint{margin-top:8px;font-size:14px;color:var(--ink);background:#e2d6b9;border-radius:8px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.home{justify-content:flex-start;padding-top:8px;gap:10px}
.lens{width:84px;height:84px}.home h1{font-size:46px}.home p{font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;background:#13283d;border:1.5px solid #34506c;border-radius:16px;padding:14px 8px;transition:transform .12s,border-color .2s}
.card:active{transform:scale(.96);border-color:var(--brass)}
.card .ic{font-size:30px}.card b{font-size:20px;color:var(--brass)}
.card small{color:#cdd8e4;font-size:13px}.card u{text-decoration:none;color:var(--mute);font-size:12px;margin-top:4px}
.back{background:#13283d;border:1.5px solid #34506c;border-radius:50%;width:38px;height:38px;font-size:16px;flex:none}
.top{gap:12px}
.ghost{background:none;border:1.5px solid #34506c;border-radius:14px;padding:12px 36px;font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DB={
"تاريخ":{i:"🏛",d:"حضارات ومعارك وقادة",q:[
["أي حضارة بنت أهرامات الجيزة؟",["الرومانية","المصرية القديمة","البابلية","الفارسية"],1,"هرم خوفو أكبرها، وبقي أعلى بناء صنعه الإنسان نحو 3800 سنة."],
["من مؤسس الدولة الأموية؟",["عبدالملك بن مروان","أبو العباس السفاح","معاوية بن أبي سفيان","الوليد بن عبدالملك"],2,"قامت الدولة الأموية عام 41هـ واتخذت دمشق عاصمة لها."],
["من القائد الذي عبر بجيشه لفتح الأندلس؟",["موسى بن نصير","طارق بن زياد","خالد بن الوليد","عقبة بن نافع"],1,"عبر طارق المضيق عام 92هـ (711م)، وسُمّي الجبل هناك «جبل طارق» نسبة إليه."],
["في أي معركة استعاد صلاح الدين بيت المقدس عام 1187م؟",["القادسية","اليرموك","حطين","عين جالوت"],2,"انتصار حطين فتح الطريق لتحرير القدس بعد نحو 88 عاماً من الاحتلال الصليبي."],
["في أي عام فتح محمد الفاتح القسطنطينية؟",["1258م","1492م","1517م","1453م"],3,"سقطت القسطنطينية في 29 مايو 1453م، وهو حدث يعدّه كثير من المؤرخين نهاية العصور الوسطى."],
["في أي عام سقطت بغداد على يد المغول؟",["1099م","1258م","1187م","1453م"],1,"دمّر المغول بغداد بقيادة هولاكو، وضاعت فيها مكتبات ومخطوطات لا تُقدَّر بثمن."]]},
"آداب":{i:"📜",d:"شعر وأمثال وأدباء",q:[
["من هو صاحب لقب «أمير الشعراء»؟",["حافظ إبراهيم","المتنبي","نزار قباني","أحمد شوقي"],3,"بُويع أحمد شوقي بإمارة الشعر عام 1927 في حفل حضره شعراء العرب."],
["أكمل المثل: «الوقت كالسيف، إن لم تقطعه...»",["قطعك","كسرك","تركك","جرحك"],0,"المثل يحثّ على اغتنام الوقت قبل أن يضيع."],
["من ترجم كتاب «كليلة ودمنة» إلى العربية؟",["الجاحظ","ابن المقفع","المعري","ابن قتيبة"],1,"نقله ابن المقفع من الفارسية في العصر العباسي، وهو حكايات على ألسنة الحيوان."],
["من شاعر المعلقة التي تبدأ بـ«قفا نبكِ»؟",["عنترة","زهير بن أبي سلمى","امرؤ القيس","لبيد"],2,"يُلقّب امرؤ القيس بالملك الضليل، ومعلقته من أشهر قصائد العصر الجاهلي."],
["من صاحب كتاب «المقدّمة» ومؤسس علم الاجتماع؟",["ابن رشد","الفارابي","ابن سينا","ابن خلدون"],3,"كتب ابن خلدون المقدمة عام 1377م، وحلّل فيها قيام الدول وسقوطها."],
["من أول عربي ينال جائزة نوبل في الأدب؟",["طه حسين","نجيب محفوظ","توفيق الحكيم","يوسف إدريس"],1,"نال نجيب محفوظ جائزة نوبل عام 1988، وأشهر أعماله «الثلاثية»."]]},
"عالم الحيوان":{i:"🦒",d:"عجائب المخلوقات",q:[
["أي حيوان يُلقّب بسفينة الصحراء؟",["الحصان","الجمل","الحمار","الفيل"],1,"سنام الجمل يخزّن دهوناً لا ماءً، ويستطيع الصبر أياماً بلا شرب."],
["أي هذه الحيوانات يملك أطول عنق؟",["الفيل","الزرافة","النعامة","الجمل"],1,"عنق الزرافة يقارب مترين، وفيه 7 فقرات فقط كعنق الإنسان!"],
["ما أسرع حيوان بري؟",["الأسد","النمر","الفهد","الحصان"],2,"يصل الفهد إلى نحو 100 كم/س، لكن لمسافات قصيرة جداً."],
["كم عدد قلوب الأخطبوط؟",["قلب واحد","قلبان","ثلاثة قلوب","أربعة قلوب"],2,"3 قلوب: اثنان للخياشيم وواحد للجسم، ودمه أزرق!"],
["كم عدد أرجل العنكبوت؟",["ست","ثمانٍ","عشر","أربع"],1,"العنكبوت ليس حشرة، بل من العنكبيات ولذلك له 8 أرجل."],
["ما أكبر حيوان عرفته الأرض؟",["الفيل الأفريقي","القرش الحوتي","الحوت الأزرق","الديناصور"],2,"الحوت الأزرق يتجاوز طوله 25 متراً، ووزنه قد يفوق 150 طناً."]]},
"علوم":{i:"🔬",d:"الكون والجسم والمادة",q:[
["ما الكوكب الأقرب إلى الشمس؟",["الزهرة","عطارد","المريخ","الأرض"],1,"يدور عطارد حول الشمس في نحو 88 يوماً أرضياً فقط."],
["ما الرمز الكيميائي للذهب؟",["Ag","Go","Au","Fe"],2,"الرمز Au من الكلمة اللاتينية aurum وتعني الذهب."],
["ما الغاز الأكثر وجوداً في الغلاف الجوي؟",["الأكسجين","النيتروجين","ثاني أكسيد الكربون","الهيدروجين"],1,"النيتروجين يشكّل نحو 78% من الهواء، والأكسجين نحو 21% فقط."],
["كم عدد عظام جسم الإنسان البالغ؟",["156","256","206","306"],2,"يولد الطفل بنحو 300 عظمة، وتلتحم بعضها مع النمو حتى تصبح 206."],
["ما أصلب مادة طبيعية معروفة؟",["الحديد","الألماس","الكوارتز","الذهب"],1,"الألماس يتكوّن من ذرات الكربون، وهو نفس عنصر الفحم لكن بترتيب مختلف."],
["كم تبلغ سرعة الضوء تقريباً؟",["300 ألف كم/ث","30 ألف كم/ث","3 ملايين كم/ث","3 آلاف كم/ث"],0,"يصل ضوء الشمس إلى الأرض في نحو 8 دقائق."]]},
"جغرافيا":{i:"🧭",d:"دول وعواصم وبحار",q:[
["ما عاصمة اليابان؟",["أوساكا","كيوتو","طوكيو","سابورو"],2,"طوكيو تُعدّ من أكبر المدن في العالم من حيث السكان."],
["ما أكبر قارة في العالم من حيث المساحة؟",["آسيا","أفريقيا","أوروبا","أمريكا الشمالية"],0,"آسيا تشكّل قرابة 30% من يابسة الأرض، ويعيش فيها أكثر من نصف سكان العالم."],
["ما أكبر صحراء حارة في العالم؟",["الربع الخالي","النقب","غوبي","الصحراء الكبرى"],3,"الصحراء الكبرى في أفريقيا تقارب في مساحتها الولايات المتحدة."],
["ما أعمق محيط في العالم؟",["الهادئ","الأطلسي","الهندي","المتجمد الشمالي"],0,"في المحيط الهادئ خندق ماريانا، وعمقه يتجاوز 10 كيلومترات."],
["ما عاصمة أستراليا؟",["سيدني","ملبورن","بيرث","كانبرا"],3,"يظن كثيرون أنها سيدني، لكن كانبرا اختيرت كحلّ وسط بين سيدني وملبورن."],
["ما أصغر دولة في العالم مساحة؟",["موناكو","الفاتيكان","سان مارينو","ليختنشتاين"],1,"الفاتيكان مساحتها نحو 0.44 كم² فقط، أي أصغر من كثير من الحدائق العامة."]]},
"ألغاز":{i:"🧩",d:"فكّر خارج الصندوق",q:[
["ما الشيء الذي يكتب ولا يقرأ؟",["القلم","الكتاب","الحبر","الورقة"],0,"ألغاز السؤال والجواب من أقدم فنون التسلية عند العرب."],
["ما الشيء الذي له أسنان ولا يعضّ؟",["المنشار","المشط","الثعبان","المفتاح"],1,"أجوبة قريبة مثل المنشار تُربك العقل، لكن المشط يطابق اللغز تماماً."],
["ما الذي يمشي بلا رجلين ويبكي بلا عينين؟",["الريح","السحاب","النهر","الظل"],1,"بكاؤه هو المطر، وهو مثال على التشبيه البلاغي في الألغاز."],
["ما الشيء الذي تملكه لكن غيرك يستخدمه أكثر منك؟",["هاتفك","بيتك","اسمك","سيارتك"],2,"اسمك ينادي به الناس أكثر مما تنادي به أنت نفسك."],
["ما الشيء الذي كلما أخذتَ منه كَبُر؟",["الظل","الحفرة","العمر","الدَّين"],1,"كل ما أخرجت منها ترابًا اتسعت أكثر. هذا تفكير جانبي."],
["عندك 3 تفاحات وأخذتَ منها 2. كم تفاحة معك؟",["واحدة","اثنتان","ثلاث","خمس"],1,"السؤال يقول «أخذتَ» لا «تركتَ»، فالتفاحتان اللتان أخذتهما معك."]]}
};
const MIX="تحقيق شامل",RANKS=["متدرب","محقق","محقق أول","رقيب","مفتش","كبير المحققين"];
const $=s=>document.querySelector(s),app=$("#app");
let cat,list,i,score,help,timer,left,locked,hidden,solved;
const vib=n=>navigator.vibrate&&navigator.vibrate(n);
const shuf=a=>a.sort(()=>Math.random()-.5);
function best(){try{return JSON.parse(localStorage.getItem("mq_best"))||{}}catch(e){return{}}}
function save(c,s,n){try{const b=best();if(!b[c]||s>b[c].s)b[c]={s,n};localStorage.setItem("mq_best",JSON.stringify(b))}catch(e){}}
function home(){
const b=best();
app.innerHTML=`<div class="home">
<svg class="lens" viewBox="0 0 120 120" fill="none"><circle cx="50" cy="50" r="32" stroke="#d2a64a" stroke-width="7"/><circle cx="50" cy="50" r="24" fill="#17304a"/><path d="M39 44a14 14 0 0 1 12-9" stroke="#efe6d2" stroke-width="4" stroke-linecap="round"/><path d="M74 74l30 30" stroke="#d2a64a" stroke-width="11" stroke-linecap="round"/></svg>
<h1 class="k">المحقق</h1>
<p>اختر ملف القضايا الذي تريد التحقيق فيه</p>
<div class="grid">${Object.entries(DB).map(([n,v])=>`<button class="card" data-c="${n}"><span class="ic">${v.i}</span><b class="k">${n}</b><small>${v.d}</small><u>${b[n]?`أفضل نتيجة: ${b[n].n}/6 · ${b[n].s}`:`${v.q.length} قضايا`}</u></button>`).join("")}</div>
<button class="cta" data-c="${MIX}">${MIX}</button></div>`;
document.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>start(e.dataset.c))}
function start(c){
cat=c;
list=c==MIX?shuf(Object.entries(DB).map(([n,v])=>({c:n,q:v.q[Math.random()*v.q.length|0]}))):DB[c].q.map(q=>({c,q}));
i=0;score=0;solved=0;help={clue:1,wit:1,exp:1};ask()}
function ask(){
const {c,q:[q,o,cr]}=list[i],N=list.length;
hidden=[];locked=false;left=20;
app.innerHTML=`<div class="top"><button class="back" id="bk" aria-label="رجوع">✕</button><div style="flex:1"><div class="rank">${RANKS[i]}</div><div class="score">${score} نقطة</div></div>
<div class="timer"><svg width="54" height="54"><circle cx="27" cy="27" r="23" fill="none" stroke="#27415b" stroke-width="5"/><circle id="ring" cx="27" cy="27" r="23" fill="none" stroke="#d2a64a" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><b id="t">20</b></div></div>
<div class="ladder">${list.map((r,k)=>`<i class="${k<i?'d':k==i?'c':''}"></i>`).join("")}</div>
<div class="file"><span class="tag">${DB[c].i} ${c} · قضية ${i+1}/${N}</span><p class="q">${q}</p><div id="hint"></div></div>
<div class="opts">${shuf(o.map((t,k)=>k)).map((k,n)=>`<button class="opt" data-k="${k}"><em>${"أبجد"[n]}</em><span>${o[k]}</span><div class="bar"></div></button>`).join("")}</div>
<div class="help"><button id="h1" ${help.clue?"":"disabled"}><b>🔍</b>كشف دليل</button><button id="h2" ${help.wit?"":"disabled"}><b>👥</b>استشارة شاهد</button><button id="h3" ${help.exp?"":"disabled"}><b>🎩</b>اتصال بخبير</button></div><div id="after"></div>`;
$("#bk").onclick=()=>{clearInterval(timer);home()};
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
$("#h1").onclick=clue;$("#h2").onclick=witness;$("#h3").onclick=expert;
clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){left--;$("#t").textContent=left;$("#ring").style.strokeDashoffset=144.5*(1-left/20);if(left<=5)vib(15);if(left<=0){clearInterval(timer);pick(-1)}}
function use(k,id){help[k]=0;$(id).disabled=true}
const cur=()=>list[i].q;
function clue(){if(locked||!help.clue)return;use("clue","#h1");const c=cur()[2];hidden=shuf([0,1,2,3].filter(k=>k!=c)).slice(0,2);hidden.forEach(k=>document.querySelector(`.opt[data-k="${k}"]`).classList.add("gone"));vib(30)}
function witness(){if(locked||!help.wit)return;use("wit","#h2");const c=cur()[2],live=[0,1,2,3].filter(k=>!hidden.includes(k));let p={},r=100,m=45+Math.random()*30|0;p[c]=m;r-=m;live.filter(k=>k!=c).forEach((k,n,a)=>{const v=n==a.length-1?r:Math.random()*r|0;p[k]=v;r-=v});live.forEach(k=>{document.querySelector(`.opt[data-k="${k}"] .bar`).style.width=Math.max(p[k],4)*.45+"%"})}
function expert(){if(locked||!help.exp)return;use("exp","#h3");const [,o,c]=cur(),alt=[0,1,2,3].filter(k=>!hidden.includes(k)&&k!=c)[0],say=Math.random()<.85?c:alt;$("#hint").innerHTML=`<div class="hint">🎩 الخبير: «أميل إلى «${o[say]}»، لكن القرار لك أيها المحقق.»</div>`}
function pick(k,btn){
if(locked)return;locked=true;clearInterval(timer);
const [,,c,f]=cur(),ok=k===c,N=list.length;
document.querySelectorAll(".opt").forEach(b=>{b.style.pointerEvents="none";if(+b.dataset.k===c)b.classList.add("ok")});
if(btn&&!ok)btn.classList.add("no");
$(".file").insertAdjacentHTML("beforeend",`<div class="stamp ${ok?'ok':'no'}">${ok?'قضية محلولة':k<0?'انتهى الوقت':'قضية فاشلة'}</div>`);
vib(ok?[20]:[80,40,80]);
if(ok){score+=100*(i+1)+left*5;solved++}
const last=i==N-1;
$("#after").innerHTML=`<div class="fact"><strong>ملف المعلومة:</strong> ${f}</div><button class="cta next" id="nx">${ok&&!last?'القضية التالية':last?'إغلاق الملف':'انتهى التحقيق'}</button>`;
$("#nx").onclick=()=>{ok&&!last?(i++,ask()):end()}}
function end(){
const N=list.length,won=solved==N,r=won?RANKS[N-1]:solved?RANKS[solved-1]:RANKS[0];
save(cat,score,solved);
app.innerHTML=`<div class="end"><h2 class="k">${won?'أحسنت يا كبير المحققين':'التحقيق لم ينتهِ بعد'}</h2><div class="big">رتبتك: ${r}</div><p style="color:#8fa3b8;font-size:18px;margin:0">حللت ${solved} من ${N} قضايا · ${score} نقطة</p><button class="cta" id="re">أعد التحقيق</button><button class="ghost" id="hm">كل الأقسام</button></div>`;
$("#re").onclick=()=>start(cat);$("#hm").onclick=home}
home();
</script>
</body>
</html>
